name: Data refresh

# Regenerate the shipped instance data from upstream and open a PR carrying the
# region diff. NEVER pushes to main directly: a bot commit without a CHANGELOG row
# + version tag would hole the version map (see ROADMAP's format gate), so this
# only opens a PR — a human merges it with the row + tag and re-baselines any
# goldens a price move shifted.
#
# Decoupled cadences (avoid wasted API calls — on-demand list prices move rarely):
#   - specs   refresh MONTHLY   (the freshness SLA; the Vantage pull is cheap)
#   - pricing refresh QUARTERLY (the official-catalogue pull; Jan/Apr/Jul/Oct)
# A SINGLE monthly cron fires; "Resolve refresh scope" turns pricing on when the
# UTC month is a quarter start, so the two cadences can never open two overlapping
# PRs (a second cron on the quarter dates would).
#
# Two stages (Phase D3):
#   fetch (matrix, one job per provider) — ONLY on a pricing run. Each reads the
#     intact shipped manifest and uploads a tiny {p}-pricing.json artifact.
#   assemble (one job) — fetch-vantage → reconcile → data-diff → split-data → PR.
# ORDER IS LOAD-BEARING: the official fetchers read the shipped manifest
# (js/{p}/regions/ + the {P}_REGION_KEYS keys) that fetch-vantage overwrites with a
# monolith, so they MUST run before it — hence a separate fetch stage on the intact
# checkout, feeding the assemble stage through artifacts.

on:
  schedule:
    # Monthly specs refresh — 1st of every month, 06:00 UTC. Pricing is additionally
    # refreshed when the UTC month is a quarter start (see "Resolve refresh scope").
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      refresh_pricing:
        description: "Also refresh pricing from the official catalogues (Phase D)"
        type: boolean
        default: false
      dry_run:
        description: "Generate the diff report only; do not open a PR"
        type: boolean
        default: false

# One refresh at a time; a queued run waits rather than racing the branch push.
concurrency:
  group: data-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # Which refresh is this? workflow_dispatch's toggle sets pricing directly; the
  # monthly cron turns it on only on a quarter start (Jan/Apr/Jul/Oct). Emitted as
  # job outputs the fetch matrix and the assemble job both read.
  scope:
    runs-on: ubuntu-latest
    outputs:
      refresh_pricing: ${{ steps.scope.outputs.refresh_pricing }}
      date: ${{ steps.scope.outputs.date }}
    steps:
      - name: Resolve refresh scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pricing="${{ github.event.inputs.refresh_pricing }}"
          else
            case "$(date -u +%-m)" in
              1 | 4 | 7 | 10) pricing="true" ;;
              *) pricing="false" ;;
            esac
          fi
          echo "refresh_pricing=$pricing" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "Refresh scope: specs=always, pricing=$pricing"

  # Fetch stage — matrix, one job per provider, ONLY on a pricing run. Each checks out
  # the intact shipped manifest, runs its official fetcher, and uploads a tiny
  # {p}-pricing.json (the large region files are never uploaded — only the normalised
  # prices). fail-fast:false so one provider's API blip doesn't cancel the others; the
  # assemble job then declines to run because this job's result is not success. AWS is
  # the long pole (35 regions); its fetcher accepts --region, so a nested per-region
  # matrix is available if per-provider proves too slow — start per-provider.
  fetch:
    needs: scope
    if: ${{ needs.scope.outputs.refresh_pricing == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        provider: [aws, azure, gcp]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # Keyless for AWS and Azure; GCP needs GCP_BILLING_API_KEY (a secret, never
      # printed by the tool). Setting it for every provider is harmless — aws/azure
      # ignore it. Output feeds the reconcile step in the assemble job.
      - name: Fetch ${{ matrix.provider }} official pricing
        env:
          GCP_BILLING_API_KEY: ${{ secrets.GCP_BILLING_API_KEY }}
        run: node tools/fetch-official-${{ matrix.provider }}.js --out ".refresh-cache/${{ matrix.provider }}-pricing.json"

      - uses: actions/upload-artifact@v7
        with:
          name: pricing-${{ matrix.provider }}
          path: .refresh-cache/${{ matrix.provider }}-pricing.json
          if-no-files-found: error
          retention-days: 7

  # Assemble stage — single job (the diff → PR flow is inherently serial). Runs on
  # every refresh; on a specs-only run the fetch matrix is skipped and reconcile is
  # skipped with it. The load-bearing order is enforced by step order here.
  assemble:
    needs: [scope, fetch]
    # fetch is skipped on a specs-only run — still assemble. But if fetch RAN and
    # failed, do not assemble a half-reconciled dataset.
    if: ${{ always() && needs.scope.result == 'success' && (needs.fetch.result == 'success' || needs.fetch.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Check out with the PAT so the credential git persists for the push is the
      # PAT, not the default GITHUB_TOKEN. A branch pushed and a PR opened under the
      # PAT DO trigger the six CI checks; a GITHUB_TOKEN push would not (by design,
      # to avoid workflow recursion).
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.DATA_REFRESH_PAT }}

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # Bring the per-provider pricing artifacts back into .refresh-cache/ (present
      # only on a pricing run). merge-multiple flattens pricing-{p}/{p}-pricing.json
      # from each artifact into the one directory reconcile-data.js reads.
      - name: Download official pricing
        if: ${{ needs.scope.outputs.refresh_pricing == 'true' }}
        uses: actions/download-artifact@v7
        with:
          pattern: pricing-*
          path: .refresh-cache
          merge-multiple: true

      # Specs: rewrite each js/{p}/{p}-data.js monolith from the Vantage bulk data.
      # This OVERWRITES the shipped manifest the fetch stage read, so it MUST come
      # after that stage. The Bearer key is a secret and is never printed by the tool.
      - name: Refresh specs (Vantage)
        env:
          VANTAGE_API_KEY: ${{ secrets.VANTAGE_API_KEY }}
        run: node tools/fetch-vantage.js --date "${{ needs.scope.outputs.date }}"

      # Reconcile the official pricing into the fresh monolith, official taking
      # precedence (Phase D2). Pricing run only. Its report (a CLEAN/CONFLICTS
      # sentinel on line 1, per-provider counts, conflicts, unverified) rides in the
      # PR body so a reviewer sees exactly what the official sources changed.
      - name: Reconcile official pricing
        if: ${{ needs.scope.outputs.refresh_pricing == 'true' }}
        run: |
          node tools/reconcile-data.js > reconcile-report.md
          cat reconcile-report.md

      # Diff the committed region data (js/{p}/regions/) against the freshly written
      # (and, on a pricing run, reconciled) monolith. MUST run before split-data,
      # which overwrites regions/. Line 1 is the <!-- data-diff: CHANGES|NO-CHANGES -->
      # sentinel the no-op guard reads.
      - name: Generate diff report
        id: diff
        run: |
          node tools/data-diff.js > diff-report.md
          sentinel=$(head -n1 diff-report.md)
          echo "sentinel<<EOF" >> "$GITHUB_OUTPUT"
          echo "$sentinel" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if printf '%s' "$sentinel" | grep -q 'data-diff: CHANGES'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          cat diff-report.md

      # No-op guard: nothing moved upstream → no branch, no PR, no review churn.
      - name: No changes — stop
        if: ${{ steps.diff.outputs.changed == 'false' }}
        run: echo "No data changes detected; skipping PR."

      # Split the monolith back into js/{p}/regions/ + the manifest — the shape the
      # page loads and the repo commits. Capture the pruned-region warning so the PR
      # can flag the required sw.js CACHE bump.
      - name: Split into region files
        id: split
        if: ${{ steps.diff.outputs.changed == 'true' }}
        run: |
          node tools/split-data.js | tee split.log
          if grep -q 'regions were removed' split.log; then
            echo "pruned=true" >> "$GITHUB_OUTPUT"
          else
            echo "pruned=false" >> "$GITHUB_OUTPUT"
          fi

      # Dry-run: keep the diff (and the reconcile report, on a pricing run) as
      # artifacts and stop before touching git.
      - name: Upload diff report (dry-run)
        if: ${{ steps.diff.outputs.changed == 'true' && github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: data-diff-report
          path: |
            diff-report.md
            reconcile-report.md
          if-no-files-found: ignore

      # Open the PR. The PAT (persisted by checkout above) pushes the branch and
      # files the PR, so the six CI checks run on PR open. The human still merges
      # with the required CHANGELOG row + version tag.
      - name: Open refresh PR
        if: ${{ steps.diff.outputs.changed == 'true' && github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.DATA_REFRESH_PAT }}
          PRUNED: ${{ steps.split.outputs.pruned }}
          REFRESH_PRICING: ${{ needs.scope.outputs.refresh_pricing }}
          DATE: ${{ needs.scope.outputs.date }}
        run: |
          set -euo pipefail
          branch="data-refresh/${DATE}-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add js/
          scope="specs"
          [ "$REFRESH_PRICING" = "true" ] && scope="specs + pricing"
          git commit -m "Data refresh ($scope) ${DATE}"
          git push origin "$branch"

          {
            echo "Automated instance-data refresh (**$scope**), snapshot \`${DATE}\`."
            echo
            echo "> [!IMPORTANT]"
            echo "> Merge this **with** a CHANGELOG version-map row + annotated tag — a"
            echo "> bot commit without them holes the version map. Re-baseline any goldens"
            echo "> a price move shifted."
            if [ "$PRUNED" = "true" ]; then
              echo
              echo "> [!WARNING]"
              echo "> Regions were pruned — bump \`CACHE\` in \`sw.js\` so clients drop the"
              echo "> stale cached copies. See the diff report below."
            fi
            echo
            if [ "$REFRESH_PRICING" = "true" ] && [ -f reconcile-report.md ]; then
              cat reconcile-report.md
              echo
            fi
            cat diff-report.md
          } > pr-body.md

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Data refresh ($scope) ${DATE}" \
            --body-file pr-body.md
