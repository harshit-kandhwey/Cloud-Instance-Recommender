name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    # @playwright/test is a devDependency now, and its postinstall downloads
    # browser binaries. This job (and typecheck) only needs the JS packages, so
    # skip that ~150 MB download here — only the e2e job needs the browser.
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dev dependencies (Prettier)
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: node tests/syntax-check.js

      - name: Test suites + golden compare
        run: node tests/run-all.js

      - name: Coverage gate (behavioral surface covered or waived)
        run: node tools/build-coverage-inventory.js --check

  typecheck:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dev dependencies (TypeScript)
        run: npm ci

      - name: Type-check JSDoc-annotated modules
        run: npm run typecheck

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The JS packages install without the browser; the browser comes from the
      # cache below (or a fresh download on a miss), keyed on the exact
      # Playwright version so a bump invalidates it automatically.
      - name: Install dev dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install browsers (+ OS deps)
        run: npx playwright install --with-deps chromium webkit

      - name: Run end-to-end suite (Chromium + WebKit)
        run: npm run test:e2e
