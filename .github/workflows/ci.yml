name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dev dependencies (Prettier)
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: node tests/syntax-check.js

      - name: Test suites + golden compare
        run: node tests/run-all.js

      - name: Coverage gate (behavioral surface covered or waived)
        run: node tools/build-coverage-inventory.js --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dev dependencies (TypeScript)
        run: npm ci

      - name: Type-check JSDoc-annotated modules
        run: npm run typecheck
