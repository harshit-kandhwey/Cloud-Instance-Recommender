name: Bug Report
description: Something is not working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as possible.

  - type: input
    id: page
    attributes:
      label: Affected Page
      description: Which page does the bug occur on?
      placeholder: "e.g. aws.html, gcp.html, multicloud.html"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Edge
        - Safari
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g. Windows 11, macOS 14, Ubuntu 22.04"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Upload CSV with ...
        2. Select region ...
        3. Click Generate ...
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: csv-sample
    attributes:
      label: Sample CSV (optional)
      description: Paste a minimal anonymized CSV that triggers the issue
      render: csv

  - type: textarea
    id: console
    attributes:
      label: Browser Console Errors (optional)
      description: Open DevTools (F12) → Console and paste any errors
      render: text
